[package]
name = "ndc-miniredis"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Hasura DDN data connector (NDC spec v0.2) for Redis-compatible stores such as mini-redis-go"

[dependencies]
ndc-sdk = { git = "https://github.com/hasura/ndc-sdk-rs", tag = "v0.9.0" }
async-trait = "0.1"
redis = { version = "0.32", features = ["tokio-comp", "aio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
indexmap = "2"
prometheus = "0.14"

[profile.release]
strip = true
